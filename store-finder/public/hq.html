<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הנהלת רשת — מוצא המוצרים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="wrap hidden" id="login-view" style="max-width:460px">
    <div class="hero"><h1>🏢 הנהלת רשת</h1><p class="muted">כל הסניפים במסך אחד.</p></div>
    <form class="card" id="hq-login">
      <label for="hq-pass">סיסמת הנהלה</label>
      <input id="hq-pass" type="password" required autocomplete="current-password">
      <p class="error" id="hq-error"></p>
      <button class="primary" type="submit" style="width:100%">כניסה</button>
    </form>
  </div>

  <div class="hidden" id="app-view">
    <header class="topbar">
      <div class="brand"><svg class="brand-pin" viewBox="0 0 160 200" aria-hidden="true"><path d="M80 190 C80 190 10 115 10 72 A70 70 0 1 1 150 72 C150 115 80 190 80 190 Z" fill="#ff7a1a"/><circle cx="80" cy="72" r="26" fill="#0b1224"/></svg>הנהלת רשת</div>
      <div class="row no-print">
        <select id="days" style="width:auto"><option value="7">7 ימים</option><option value="30" selected>30 ימים</option><option value="90">90 ימים</option></select>
        <button type="button" onclick="window.print()">🖨️ הדפסה / PDF</button>
        <button id="logout">יציאה</button>
      </div>
    </header>
    <main class="wrap" style="max-width:1180px">
      <p class="muted" id="period" style="margin-top:14px"></p>
      <div class="kpis k6" id="kpis"></div>
      <div class="grid2">
        <div class="card spotlight good" id="best"></div>
        <div class="card spotlight bad" id="worst"></div>
      </div>
      <div class="card">
        <h2>השוואת סניפים</h2>
        <p class="muted">ירוק = הכי טוב ברשת, אדום = דורש תשומת לב. לחיצה על כותרת ממיינת.</p>
        <div class="table-wrap"><table class="hq-table" id="table"></table></div>
      </div>
      <div class="card">
        <h2>🛒 מה לקוחות מבקשים בכל הרשת ואין לנו</h2>
        <p class="muted">חיפושים שלא נמצאו ובקשות "תביאו את זה", מכל הסניפים יחד. מוצר שמבוקש בכמה סניפים הוא החלטת רכש של הרשת.</p>
        <div id="missing" class="rank"></div>
      </div>
    </main>
  </div>
  <script type="module" src="/js/hq.js"></script>
</body>
</html>
