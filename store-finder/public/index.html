<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מוצא המוצרים — לבעלי חנויות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>📍 מוצא המוצרים</h1>
      <p class="muted">מצלמים את המדפים. הלקוחות סורקים QR בכניסה, כותבים מה הם מחפשים, ורואים תמונה של המוצר ואיפה הוא נמצא בחנות.</p>
    </div>
    <div class="grid2">
      <form class="card" id="register">
        <h2>חנות חדשה</h2>
        <label for="r-name">שם החנות</label>
        <input id="r-name" required maxlength="80" placeholder="למשל: כלי בית אלישע">
        <label for="r-slug">כתובת קצרה (באנגלית)</label>
        <input id="r-slug" required dir="ltr" pattern="[a-z0-9][a-z0-9\-]{2,39}" placeholder="eliasha-home">
        <p class="muted" style="font-size:.85rem">הלקוחות ייכנסו ל־<span dir="ltr" id="slug-preview">/s/…</span></p>
        <label for="r-pass">סיסמה</label>
        <input id="r-pass" type="password" required minlength="6" autocomplete="new-password">
        <div id="r-code-box" class="hidden">
          <label for="r-code">קוד הרשמה</label>
          <input id="r-code" autocomplete="off" dir="ltr">
        </div>
        <p class="error" id="r-error"></p>
        <button class="primary" type="submit">פתיחת חנות</button>
      </form>
      <form class="card" id="login">
        <h2>כניסה לחנות קיימת</h2>
        <label for="l-slug">כתובת החנות</label>
        <input id="l-slug" required dir="ltr" autocomplete="username">
        <label for="l-pass">סיסמה</label>
        <input id="l-pass" type="password" required autocomplete="current-password">
        <p class="error" id="l-error"></p>
        <button class="primary" type="submit">כניסה</button>
      </form>
    </div>
    <p style="text-align:center;margin-top:8px"><a class="btn" href="/staff.html">👷 כניסת עובדים</a></p>
  </div>
  <script type="module">
    import { api, setToken, getToken } from '/js/api.js';
    if (getToken()) location.href = '/owner.html';
    const $ = (id) => document.getElementById(id);
    api('/api/config').then((c) => { $('r-code-box').classList.toggle('hidden', !c.registrationCode); $('r-code').required = c.registrationCode; }).catch(() => {});
    $('r-slug').addEventListener('input', () => { $('slug-preview').textContent = `${location.origin}/s/${$('r-slug').value || '…'}`; });
    $('register').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('r-error').textContent = '';
      try {
        const { token } = await api('/api/stores', { method: 'POST', body: { name: $('r-name').value, slug: $('r-slug').value, password: $('r-pass').value, code: $('r-code').value } });
        setToken(token);
        location.href = '/owner.html';
      } catch (err) { $('r-error').textContent = err.message; }
    });
    $('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('l-error').textContent = '';
      try {
        const { token } = await api('/api/login', { method: 'POST', body: { slug: $('l-slug').value, password: $('l-pass').value } });
        setToken(token);
        location.href = '/owner.html';
      } catch (err) { $('l-error').textContent = err.message; }
    });
  </script>
</body>
</html>
